<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>🎉 Happy celebration! 🎂</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background: #ffffff;
            color: #0a0a0a;
            overflow: hidden;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            position: relative;
        }

        /* Subtle animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg,
                    rgba(167, 139, 250, 0.1),
                    rgba(34, 211, 238, 0.1),
                    rgba(248, 113, 113, 0.1),
                    rgba(34, 197, 94, 0.1));
            background-size: 400% 400%;
            animation: subtleGradient 12s ease infinite;
            z-index: -1;
        }

        @keyframes subtleGradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .wrap {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 18px 24px;
            font-weight: 800;
            font-size: 22px;
        }

        header .logo {
            width: 14px;
            height: 14px;
            background: #a78bfa;
            border-radius: 4px;
            box-shadow: 0 0 0 6px rgba(167, 139, 250, 0.25);
            margin-right: 8px;
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {

            0%,
            100% {
                background: #a78bfa;
                box-shadow: 0 0 0 6px rgba(167, 139, 250, 0.25);
            }

            50% {
                background: #f87171;
                box-shadow: 0 0 0 6px rgba(248, 113, 113, 0.25);
            }
        }

        main {
            display: grid;
            place-items: center;
        }

        .hero {
            text-align: center;
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 5vw;
            display: grid;
            gap: 8px;
        }

        .celebration-title {
            font-size: clamp(36px, 6vw, 72px);
            font-weight: 800;
            letter-spacing: -0.02em;
            animation: gentleBounce 3s ease-in-out infinite, colorShift 6s ease-in-out infinite;
            margin-bottom: 16px;
        }

        @keyframes gentleBounce {

            0%,
            100% {
                transform: translateY(0px) scale(1);
            }

            50% {
                transform: translateY(-8px) scale(1.02);
            }
        }

        @keyframes colorShift {
            0% {
                color: #0a0a0a;
            }

            25% {
                color: #a78bfa;
            }

            50% {
                color: #22d3ee;
            }

            75% {
                color: #f87171;
            }

            100% {
                color: #0a0a0a;
            }
        }

        .date-display {
            margin-top: 16px;
            color: #404040;
            font-size: clamp(16px, 2.2vw, 22px);
            line-height: 1.6;
            animation: subtlePulse 4s ease-in-out infinite;
        }

        @keyframes subtlePulse {

            0%,
            100% {
                opacity: 0.8;
            }

            50% {
                opacity: 1;
            }
        }

        .cake {
            font-size: clamp(32px, 5vw, 48px);
            animation: gentleRotate 8s linear infinite;
            margin: 32px 0;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: inline-block;
        }

        .cake:hover {
            transform: scale(1.1);
        }

        @keyframes gentleRotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            margin-top: 24px;
            color: #404040;
            font-size: clamp(16px, 2.2vw, 22px);
            line-height: 1.6;
            animation: fadeInUp 2s ease-out;
            max-width: 600px;
        }

        .party-button {
            margin-top: 40px;
            padding: 12px 24px;
            font-size: clamp(14px, 2vw, 16px);
            font-weight: 800;
            letter-spacing: 0.03em;
            background: linear-gradient(45deg, #a78bfa, #22d3ee);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(167, 139, 250, 0.3);
            transition: all 0.3s ease;
            animation: subtleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes subtleGlow {
            from {
                box-shadow: 0 4px 12px rgba(167, 139, 250, 0.3);
            }

            to {
                box-shadow: 0 4px 16px rgba(167, 139, 250, 0.5), 0 0 20px rgba(167, 139, 250, 0.2);
            }
        }

        .party-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(167, 139, 250, 0.4);
        }

        .party-button:active {
            transform: translateY(0px);
        }

        /* Celebration effects */
        .confetti {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #a78bfa;
            border-radius: 2px;
            animation: gentleFall linear infinite;
            opacity: 0.7;
        }

        .confetti:nth-child(odd) {
            background: #22d3ee;
            animation-duration: 4s;
            animation-delay: -2s;
        }

        .confetti:nth-child(even) {
            background: #f87171;
            animation-duration: 3.5s;
            animation-delay: -1s;
        }

        .confetti:nth-child(3n) {
            background: #34d399;
            border-radius: 50%;
        }

        .confetti:nth-child(4n) {
            background: #fbbf24;
            transform: rotate(45deg);
        }

        @keyframes gentleFall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 0.7;
            }

            100% {
                transform: translateY(100vh) rotate(180deg);
                opacity: 0;
            }
        }

        .sparkle {
            position: absolute;
            color: #a78bfa;
            font-size: 0.8rem;
            animation: gentleSparkle 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes gentleSparkle {

            0%,
            100% {
                opacity: 0;
                transform: scale(0) rotate(0deg);
            }

            50% {
                opacity: 0.6;
                transform: scale(1) rotate(90deg);
            }
        }

        .firework {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            animation: subtleFirework 3s ease-out infinite;
        }

        @keyframes subtleFirework {
            0% {
                transform: scale(0);
                opacity: 0.6;
            }

            50% {
                opacity: 0.4;
            }

            100% {
                transform: scale(12);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <span class="logo"></span>
            🎉 Birthday Celebration 🎂
        </header>
        <main>
            <section class="hero">
                <div class="celebration-title">Happy birthday!</div>
                <div class="date-display">I'm celebrating my birthday today - January 22nd!</div>
                <div class="cake" onclick="explodeCake()">🎂</div>
                <div class="message">It's my special day! Thank you for being here to celebrate with me. Here's to
                    another year of adventures, growth, and making amazing memories together!</div>
                <button class="party-button" onclick="partyMode()">🎊 Start Celebration 🎊</button>
            </section>
        </main>
        <div id="canvas"></div>
    </div>

    <script>
        // Create confetti
        function createConfetti() {
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.animationDelay = Math.random() * 4 + 's';
                confetti.style.animationDuration = (Math.random() * 2 + 3) + 's';
                document.body.appendChild(confetti);
            }
        }

        // Create sparkles around the cursor
        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.innerHTML = '✨';
            sparkle.style.left = x + 'px';
            sparkle.style.top = y + 'px';
            document.body.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, 1500);
        }

        // Create fireworks
        function createFirework() {
            const colors = ['#a78bfa', '#22d3ee', '#f87171', '#34d399', '#fbbf24'];

            for (let i = 0; i < 12; i++) {
                const firework = document.createElement('div');
                firework.className = 'firework';
                firework.style.background = colors[Math.floor(Math.random() * colors.length)];
                firework.style.left = Math.random() * window.innerWidth + 'px';
                firework.style.top = Math.random() * window.innerHeight + 'px';
                firework.style.animationDelay = Math.random() * 1 + 's';
                document.body.appendChild(firework);

                setTimeout(() => {
                    firework.remove();
                }, 3000);
            }
        }

        // Explode cake function
        function explodeCake() {
            const cake = document.querySelector('.cake');
            cake.style.animation = 'none';
            cake.style.transform = 'scale(0)';

            // Create explosion effect
            for (let i = 0; i < 30; i++) {
                const piece = document.createElement('div');
                piece.innerHTML = ['🍰', '🧁', '🍪', '🍩', '🍭'][Math.floor(Math.random() * 5)];
                piece.style.position = 'absolute';
                piece.style.fontSize = '2rem';
                piece.style.left = '50%';
                piece.style.top = '50%';
                piece.style.transform = 'translate(-50%, -50%)';
                piece.style.animation = `explode 2s ease-out forwards`;
                piece.style.animationDelay = Math.random() * 0.5 + 's';

                // Add random direction
                const angle = (Math.PI * 2 * i) / 30;
                const distance = 200 + Math.random() * 200;
                piece.style.setProperty('--end-x', Math.cos(angle) * distance + 'px');
                piece.style.setProperty('--end-y', Math.sin(angle) * distance + 'px');

                document.body.appendChild(piece);

                setTimeout(() => {
                    piece.remove();
                }, 2000);
            }

            setTimeout(() => {
                cake.style.transform = 'scale(1)';
                cake.style.animation = 'rotate 4s linear infinite';
            }, 2000);
        }

        // Party mode function
        function partyMode() {
            // Intensify background animation
            document.body.querySelector('::before') && (document.body.style.setProperty('--animation-speed', '4s'));

            // Create multiple fireworks
            for (let i = 0; i < 4; i++) {
                setTimeout(() => {
                    createFirework();
                }, i * 600);
            }

            // Add celebration confetti
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.animationDelay = '0s';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(confetti);

                    setTimeout(() => {
                        confetti.remove();
                    }, 6000);
                }, i * 80);
            }

            // Create floating celebration emojis
            const celebrationEmojis = ['🎉', '🎊', '🎈', '🎂', '🎁', '✨', '🌟', '💫'];
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const emoji = document.createElement('div');
                    emoji.innerHTML = celebrationEmojis[Math.floor(Math.random() * celebrationEmojis.length)];
                    emoji.style.position = 'absolute';
                    emoji.style.fontSize = 'clamp(1.5rem, 3vw, 2.5rem)';
                    emoji.style.left = Math.random() * 100 + '%';
                    emoji.style.top = '100%';
                    emoji.style.color = '#a78bfa';
                    emoji.style.animation = 'gentleFall 5s linear forwards';
                    emoji.style.pointerEvents = 'none';
                    document.body.appendChild(emoji);

                    setTimeout(() => {
                        emoji.remove();
                    }, 5000);
                }, i * 300);
            }

            // Update button text
            const button = document.querySelector('.party-button');
            const originalText = button.innerHTML;
            button.innerHTML = '🎉 Celebrating! 🎉';

            setTimeout(() => {
                button.innerHTML = originalText;
            }, 8000);
        }

        // Mouse move sparkle effect
        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.8) {
                createSparkle(e.clientX, e.clientY);
            }
        });

        // Add CSS for explosion animation
        const style = document.createElement('style');
        style.textContent = `
        @keyframes explode {
          0% {
            transform: translate(-50%, -50%) scale(1) rotate(0deg);
            opacity: 1;
          }
          100% {
            transform: translate(calc(-50% + var(--end-x)), calc(-50% + var(--end-y))) scale(0) rotate(720deg);
            opacity: 0;
          }
        }
      `;
        document.head.appendChild(style);

        // Initialize confetti on load
        createConfetti();

        // Auto fireworks every 10 seconds
        setInterval(() => {
            if (Math.random() > 0.5) {
                createFirework();
            }
        }, 10000);

        // Auto party mode when page loads (it's the celebration!)
        setTimeout(() => {
            partyMode();
        }, 2000);
    </script>
</body>

</html>
